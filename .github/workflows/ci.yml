name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  # The crate declares a minimum supported Rust version; a dependency bump or a
  # newly used language feature can quietly break it, because every other job
  # runs on stable.  This is the check that caught `ignore` pulling in
  # let-chains and two crates whose own sources had outgrown their declared
  # MSRV.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # An action reference has to be a literal, so this one number cannot be
      # read out of Cargo.toml.  The step after it derives the expectation from
      # the source and fails loudly when the two disagree: this pin sat at
      # 1.85.0 against a declared rust-version of 1.88 for a whole release, and
      # because cargo treats a too-old toolchain as a hard error, every run
      # aborted before compiling a single crate — a red CI nobody could read.
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Toolchain pin agrees with rust-version in Cargo.toml
        run: |
          declared="$(sed -n 's/^rust-version *= *"\([0-9][0-9.]*\)".*/\1/p' Cargo.toml)"
          test -n "$declared"
          installed="$(rustc --version | cut -d' ' -f2)"
          case "$installed" in
            "$declared"|"$declared".*) ;;
            *)
              echo "::error::Cargo.toml declares rust-version $declared;" \
                   "the pinned toolchain is $installed. Update the" \
                   "dtolnay/rust-toolchain pin above."
              exit 1
              ;;
          esac
      - name: Build on the declared minimum supported Rust
        run: cargo check --all-targets --locked
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install --yes vim

      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable

      # The Makefile is the sole source of truth for what the gate runs: `check`
      # already covers core-verify, the Rust suite, every tests/vim file,
      # defcompile and vim-core.  Hand-listing a subset here is how a workflow
      # ends up silently skipping the targets added after it was written.
      - name: Run quality gate
        run: make check

      - name: Verify installer and daemon handshake
        run: |
          ./install.sh
          response="$(printf '%s\n' '{"type":"version","id":1}' | ./lib/simpleline-daemon)"
          grep -F '"type":"version"' <<<"$response"
          # Read the expected version from the source rather than hardcoding it;
          # the equivalent assertion in simplegit silently drifted behind two
          # protocol bumps before anyone noticed.
          expected="$(sed -n 's/^const PROTOCOL_VERSION: u32 = \([0-9]*\);/\1/p' \
            src/simpleline/simpleline_daemon.rs)"
          test -n "$expected"
          grep -F "\"protocol\":$expected" <<<"$response"
